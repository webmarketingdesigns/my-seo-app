services:
  - type: web
    name: my-credit-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    # Paid tier: the free plan spins down after 15 minutes idle.
    plan: starter
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: credits-db
          property: connectionString

databases:
  # NOT the free plan: free Postgres expires 30 days after creation and is then
  # deleted along with its data. That is exactly what happened to the original
  # credits-db, which took the credit history with it.
  - name: credits-db
    plan: basic-256mb
