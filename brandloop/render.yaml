services:
  - type: web
    name: brandloop
    runtime: python
    rootDir: brandloop
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: brandloop-db
          property: connectionString

databases:
  - name: brandloop-db
    plan: free
