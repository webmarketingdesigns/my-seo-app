<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karen & Wally – Credit Tracker</title>

  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#2c3e50" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Credits" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />

  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header>
    <h1>🍽️ Karen &amp; Wally's Credit Tracker</h1>
    <a href="/report" class="report-link">📊 Monthly Report</a>
    <a href="/heloc" class="report-link">🏠 1st Lien HELOC Calculator</a>
    <div class="month-nav">
      <button id="prevMonth" class="nav-btn">&#8592; Prev</button>
      <span id="monthLabel" class="month-label"></span>
      <button id="nextMonth" class="nav-btn">Next &#8594;</button>
    </div>
  </header>

  <div class="hero-banner">
    <img src="/static/images/hero.jpg" alt="Karen and Wally" class="hero-img" />
    <div class="hero-overlay">
      <span class="hero-text">Karen &amp; Wally</span>
    </div>
  </div>

  <main>
    <!-- Summary Cards -->
    <section class="cards">
      <div class="card karen">
        <div class="card-name">Karen</div>
        <div class="credit-bar-wrap">
          <div class="credit-bar" id="karenBar"></div>
        </div>
        <div class="credit-numbers">
          <span class="remaining" id="karenRemaining">—</span>
          <span class="label">credits left</span>
        </div>
        <div class="spent-line">Spent: <span id="karenSpent">—</span> / 350</div>
      </div>

      <div class="card wally">
        <div class="card-name">Wally</div>
        <div class="credit-bar-wrap">
          <div class="credit-bar" id="wallyBar"></div>
        </div>
        <div class="credit-numbers">
          <span class="remaining" id="wallyRemaining">—</span>
          <span class="label">credits left</span>
        </div>
        <div class="spent-line">Spent: <span id="wallySpent">—</span> / 350</div>
      </div>
    </section>

    <!-- Month info -->
    <div class="month-info" id="monthInfo"></div>

    <!-- Add Transaction -->
    <section class="add-section" id="addSection">
      <h2>Add a Purchase</h2>
      <form id="addForm">
        <div class="form-row">
          <label>Who?
            <select id="personSelect">
              <option value="karen">Karen</option>
              <option value="wally">Wally</option>
            </select>
          </label>
          <label>Date
            <input type="date" id="txnDate" />
          </label>
        </div>
        <div class="form-row">
          <label>Activity
            <select id="activitySelect">
              <option value="Breakfast">Breakfast</option>
              <option value="Lunch">Lunch</option>
              <option value="Dinner">Dinner</option>
            </select>
          </label>
          <label>Description <span class="optional">(optional notes)</span>
            <input type="text" id="txnDesc" placeholder="" maxlength="200" />
          </label>
        </div>
        <div class="form-row">
          <label>Credits Spent
            <input type="number" id="txnAmount" min="0.01" step="0.01" placeholder="0.00" />
          </label>
        </div>
        <button type="submit" class="submit-btn">Add Purchase</button>
        <div class="form-msg" id="formMsg"></div>
      </form>
    </section>

    <!-- Transaction Log -->
    <section class="log-section">
      <div class="log-header">
        <h2>This Month's Purchases</h2>
        <div class="filters">
          <div class="filter-group">
            <button class="filter-btn active" data-filter="person" data-value="all">Everyone</button>
            <button class="filter-btn" data-filter="person" data-value="karen">Karen</button>
            <button class="filter-btn" data-filter="person" data-value="wally">Wally</button>
          </div>
          <div class="filter-group">
            <button class="filter-btn active" data-filter="activity" data-value="all">All Activities</button>
            <button class="filter-btn" data-filter="activity" data-value="Breakfast">Breakfast</button>
            <button class="filter-btn" data-filter="activity" data-value="Lunch">Lunch</button>
            <button class="filter-btn" data-filter="activity" data-value="Dinner">Dinner</button>
          </div>
        </div>
      </div>
      <div id="txnList" class="txn-list">
        <p class="empty-msg">Loading…</p>
      </div>
    </section>
  </main>

  <script src="/static/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js');
    }
  </script>
</body>
</html>
